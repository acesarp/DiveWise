name: Streamlit app

permissions:
  contents: read
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
jobs:
  streamlit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Analysing the code with pylint
        run: |
          pip install pylint
          pylint --errors-only --disable=import-error $(git ls-files '*.py')
      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude .venv,env
      - name: Streamlit smoke test
        uses: streamlit/streamlit-app-action@v0.0.3
        with:
          app-path: app.py
        env:
          # Fake key: only lets the services start. A real one would cost money on every run
          OPENAI_API_KEY: sk-ci-placeholder

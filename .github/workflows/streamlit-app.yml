name: Streamlit app

permissions:
  contents: read
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
jobs:
  streamlit-setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Analysing the code with pylint
        run: |
          pip install pylint
          pylint --errors-only --disable=import-error $(git ls-files '*.py')
      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude .venv,env
  deploy:
    name: Deploy to VM
    needs: streamlit-setup
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, divewise]
    concurrency:
      group: deploy-divewise
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Write .env from secrets
        # compose reads the keys from .env (env_file). The file is readable only by the runner user.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          umask 077
          printf 'OPENAI_API_KEY=%s\nAPP_PASSWORD=%s\n' "$OPENAI_API_KEY" "$APP_PASSWORD" > .env

      - name: Build and restart
        # The image is built on the VM itself, so no registry or registry login is involved.
        run: |
          docker compose build
          docker compose up -d
          docker image prune -f

      - name: Smoke test
        # Waits up to a minute for Streamlit to answer, and shows the container logs if it never does.
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3001/_stcore/health && exit 0
            sleep 2
          done
          docker compose logs --tail 50
          exit 1

      - name: Remove .env
        if: always()
        run: rm -f .env
